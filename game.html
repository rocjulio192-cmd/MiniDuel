<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RICOCHET — duel d'arène</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0fb;--bg2:#e2e5f6;--panel:#ffffff;--line:#c6cbee;--ink:#1a1d45;--mut:#5b62a0;
  --me:#e2385f;--op:#0c9c8f;--gold:#c48a0a;--danger:#d2263a;--wall:#2b3070;
  --shadow:0 10px 30px rgba(40,46,120,.14);
  --disp:'Unbounded','Trebuchet MS',system-ui,sans-serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11132c;--bg2:#1a1d42;--panel:#1d2150;--line:#343b7c;--ink:#eef0ff;--mut:#9aa2dc;
    --me:#ff6b8b;--op:#4fe0d0;--gold:#f0c56b;--danger:#ff4d5e;--wall:#7f89e8;--shadow:0 14px 34px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#11132c;--bg2:#1a1d42;--panel:#1d2150;--line:#343b7c;--ink:#eef0ff;--mut:#9aa2dc;
  --me:#ff6b8b;--op:#4fe0d0;--gold:#f0c56b;--danger:#ff4d5e;--wall:#7f89e8;--shadow:0 14px 34px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;position:relative;
  background-image:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--me) 14%,transparent),transparent 45%),radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--op) 16%,transparent),transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.02em}
.screen{display:none;position:absolute;inset:0;padding:14px 16px 14px;flex-direction:column;overflow-y:auto;max-width:560px;margin:0 auto}
.screen.on{display:flex}
.logo{font-family:var(--disp);font-weight:900;font-size:clamp(40px,13.5vw,74px);line-height:.95;letter-spacing:-.05em;margin:16px 0 8px;
  background:linear-gradient(100deg,var(--me) 0 46%,var(--op) 54% 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mut);max-width:34ch;line-height:1.45;margin:0 0 18px;font-weight:700}
.menu{display:grid;gap:10px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;transition:transform .12s,border-color .12s;width:100%}
.card:active{transform:scale(.985)}
.card:hover{border-color:var(--gold)}
.card.hot{border-color:var(--me);background:color-mix(in srgb,var(--me) 9%,var(--panel))}
.card b{font-family:var(--disp);font-size:14.5px;display:block;margin-bottom:3px}
.card small{color:var(--mut);line-height:1.35;display:block;font-weight:600}
.ico{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--bg2);color:var(--ink)}
.ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:auto;padding-top:16px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;gap:8px;flex-wrap:wrap}
.foot strong{color:var(--ink);font-family:var(--disp);font-size:13px}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;background:var(--panel)}
.pill.on{border-color:var(--gold);color:var(--gold)}
.back{align-self:flex-start;padding:6px 2px 10px;color:var(--mut);font-weight:700}
.h2{font-size:22px;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px;line-height:1.4;font-weight:600}
.lv{display:flex;gap:8px;margin-bottom:12px}
.lv .pill{flex:1;text-align:center;padding:10px 6px}
.lds{display:grid;gap:9px}
.ld{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;transition:transform .1s,border-color .1s}
.ld:hover,.ld:focus-visible{border-color:var(--me)}
.ld:active{transform:scale(.985)}
.ld .ico{background:color-mix(in srgb,var(--me) 16%,var(--bg2));color:var(--me)}
.ld b{font-family:var(--disp);font-size:14.5px}
.ld .st{font-size:12px;color:var(--mut);margin:2px 0 3px;font-weight:800}
.ld small{color:var(--mut);line-height:1.35;display:block;font-weight:600}
#sc-match{padding:0;gap:0;overflow:hidden;max-width:none}
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;gap:10px;flex:none}
.hs{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;min-width:0}
.hs.r{justify-content:flex-end}
.hs span:first-child,.hs.r span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp{display:flex;gap:4px}
.rp i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);display:block}
.rp i.w{background:var(--gold);border-color:var(--gold)}
#hmid{text-align:center;min-width:80px}
#htimer{font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
#hlabel{font-size:11px;color:var(--mut);font-weight:800;min-height:14px}
#hlabel.w{color:var(--danger)}
#stage{position:relative;flex:1 1 auto;min-height:0}
#cv{position:absolute;left:0;top:0;touch-action:none;display:block}
#hint{position:absolute;left:12px;right:12px;top:8px;text-align:center;font-weight:800;font-size:15px;line-height:1.35;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px;display:none;box-shadow:var(--shadow);z-index:4}
#hint.on{display:block}
#hint button{margin-top:8px;color:var(--mut);font-weight:700;text-decoration:underline;font-size:13px}
#hint .go{display:inline-block;margin-top:8px;background:var(--me);color:#fff;border-radius:12px;padding:10px 16px;font-family:var(--disp);font-size:13px;text-decoration:none}
#ctrl{display:none;position:relative;height:clamp(150px,27dvh,230px);flex:none;touch-action:none;user-select:none;-webkit-user-select:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.coarse #ctrl{display:block}
.zone{position:absolute;top:0;bottom:0;width:50%;touch-action:none}
#zl{left:0}#zr{right:0}
.zone .base{display:none;position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid var(--line);background:color-mix(in srgb,var(--panel) 60%,transparent);pointer-events:none}
.zone .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--ink);opacity:.8}
#zl .lbl,#zr .lbl{position:absolute;left:0;right:0;bottom:26%;text-align:center;color:var(--mut);font-size:12px;font-weight:800;pointer-events:none;line-height:1.4}
.cbtn{position:absolute;top:8px;width:66px;height:66px;border-radius:50%;z-index:3;background:conic-gradient(var(--gold) calc(var(--cd,1)*360deg),var(--line) 0);display:grid;place-items:center;touch-action:none}
.cbtn span{width:56px;height:56px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--disp);font-size:9.5px;font-weight:700;pointer-events:none}
.cbtn.ready{background:var(--gold)}
#bDash{left:12px}#bPar{right:12px}
#sc-end{justify-content:center;text-align:center;gap:10px}
#sc-end h2{font-size:clamp(32px,10vw,48px)}
.big{font-family:var(--disp);font-size:36px;font-weight:900;font-variant-numeric:tabular-nums}
.list{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:8px 14px;text-align:left}
.list div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:700}
.list div:last-child{border:0}
.stack{display:grid;gap:8px;margin-top:8px}
.btn{height:48px;border-radius:14px;font-family:var(--disp);font-weight:700;font-size:13px;border:1.5px solid var(--line);background:var(--panel);padding:0 14px}
.btn.pri{background:var(--me);border-color:var(--me);color:#fff}
#netmsg{padding:12px 14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);color:var(--mut);line-height:1.45;margin:10px 0;font-weight:700}
input.code{height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--disp);font-size:16px;text-align:center;letter-spacing:.2em;text-transform:uppercase;width:100%}
#modal{position:fixed;inset:0;background:rgba(8,10,30,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);width:min(560px,100%);max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--line)}
#modal h3{font-size:15px;margin:14px 0 6px}
#modal p,#modal li{line-height:1.5;color:var(--mut);font-weight:600}
#modal b{color:var(--ink)}
#modal ul{padding-left:18px;margin:6px 0}
#status{text-align:center;color:var(--mut);font-weight:700;min-height:18px;margin-top:12px}
.sec{font-family:var(--disp);font-size:11px;letter-spacing:.12em;color:var(--mut);margin:14px 2px 8px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s;min-width:0}
.rcard:active,.card:active{transform:scale(.985)}
.rcard:hover{border-color:var(--gold)}
.rcard .top{display:flex;gap:10px;align-items:center}
.rcard .rt{font-family:var(--disp);font-size:10.5px;color:var(--mut);letter-spacing:.06em}
.rcard b{font-family:var(--disp);font-size:15px;line-height:1.15;display:block}
.rcard small{color:var(--mut);font-weight:700;font-size:12px}
.bar{height:6px;border-radius:6px;background:var(--bg2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .8s cubic-bezier(.2,.9,.2,1)}
.card.sm{padding:12px;gap:10px}
.card.sm b{font-size:13.5px}
.link{margin:14px auto 0;color:var(--mut);font-weight:800;text-decoration:underline;font-size:13.5px;padding:6px}
.link.hot{color:var(--me)}
.ld .bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;margin:6px 0 4px;align-items:center}
.ld .bars span{font-size:10.5px;font-weight:800;color:var(--mut)}
.ld .bars i{display:block;height:5px;border-radius:5px;background:var(--bg2);position:relative;overflow:hidden}
.ld .bars i::after{content:'';position:absolute;inset:0;width:var(--v);background:var(--me);border-radius:5px}
#quit{position:absolute;left:8px;bottom:6px;z-index:5;opacity:.75;font-size:12px;padding:6px 10px}
#quit.arm{opacity:1;border-color:var(--danger);color:var(--danger)}
.rankbox{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;justify-items:center}
.rankbox .row{display:flex;align-items:center;gap:14px}
.delta{font-family:var(--disp);font-size:40px;font-weight:900;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.delta.up{color:var(--op)}.delta.down{color:var(--danger)}
.promo{font-family:var(--disp);font-size:13px;color:var(--gold);font-weight:700;text-align:center}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.card,.ld{transition:none}}
</style>
</head>
<body>

<section id="sc-home" class="screen on">
  <h1 class="logo">RICOCHET</h1>
  <p class="tag">Duel d'arène en temps réel. Tire, esquive, renvoie les balles.</p>
  <div class="sec">CLASSÉ</div>
  <div class="grid2">
    <button class="rcard" id="m-rai"><div class="top"><span id="rb-ai"></span><span><span class="rt">CONTRE IA</span><b id="rn-ai"></b></span></div><small id="rs-ai"></small><div class="bar"><i id="rbar-ai"></i></div></button>
    <button class="rcard" id="m-rpvp"><div class="top"><span id="rb-pvp"></span><span><span class="rt">CONTRE JOUEURS</span><b id="rn-pvp"></b></span></div><small id="rs-pvp"></small><div class="bar"><i id="rbar-pvp"></i></div></button>
  </div>
  <div class="sec">NORMAL · sans points</div>
  <div class="grid2">
    <button class="card sm" id="m-nbot"><span class="ico" data-ic="pistol"></span><span><b>Contre un bot</b><small>Tu choisis la difficulté</small></span></button>
    <button class="card sm" id="m-npvp"><span class="ico" data-ic="blade"></span><span><b>Contre un joueur</b><small>Rapide ou avec un code</small></span></button>
  </div>
  <button class="link" id="m-tuto">Apprendre en 30 secondes</button>
  <div class="foot">
    <span class="mini"><button class="pill" id="s-aim">Ligne de visée : oui</button><button class="pill" id="s-snd">Son : oui</button><button class="pill" id="s-how">Règles</button></span>
  </div>
</section>

<section id="sc-pick" class="screen">
  <button class="back" id="pk-back">← Retour</button>
  <h2 class="h2" id="pk-title">Choisis ton style</h2>
  <p class="sub" id="pk-sub"></p>
  <div class="lv" id="pk-lv"></div>
  <div class="lds" id="pk-lds"></div>
  <div id="status"></div>
</section>

<section id="sc-net" class="screen">
  <button class="back" id="nt-back">← Retour</button>
  <h2 class="h2" id="nt-title">Duel en ligne</h2>
  <p class="sub" id="nt-sub">Tu affrontes les personnes qui ont cette page ouverte en même temps que toi.</p>
  <div id="netmsg">Connexion…</div>
  <div class="stack" id="netbtns">
    <button class="btn pri" id="nt-quick">Match rapide</button>
    <button class="btn" id="nt-create">Créer un salon privé</button>
    <input class="code" id="nt-code" maxlength="6" placeholder="CODE" autocomplete="off" aria-label="Code du salon">
    <button class="btn" id="nt-join">Rejoindre avec le code</button>
    <button class="btn" id="nt-bot" style="display:none">Jouer contre un bot en attendant</button>
  </div>
</section>

<section id="sc-match" class="screen">
  <div id="hud">
    <div class="hs"><span id="hn0">Toi</span><span class="rp" id="rp0"></span></div>
    <div id="hmid"><div id="htimer">0:00</div><div id="hlabel"></div></div>
    <div class="hs r"><span class="rp" id="rp1"></span><span id="hn1">Bot</span></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <button class="pill" id="quit">Quitter</button>
  </div>
  <div id="ctrl">
    <div class="zone" id="zl"><div class="base"><div class="knob"></div></div><div class="lbl">Bouger</div></div>
    <div class="zone" id="zr"><div class="base"><div class="knob"></div></div><div class="lbl">Viser<br>pousser à fond = tirer</div></div>
    <button class="cbtn ready" id="bDash" aria-label="Dash"><span>DASH</span></button>
    <button class="cbtn ready" id="bPar" aria-label="Parade"><span>PARADE</span></button>
  </div>
</section>

<section id="sc-end" class="screen">
  <h2 id="e-title"></h2>
  <p class="sub" id="e-sub"></p>
  <div id="e-body"></div>
  <div class="stack" id="e-btns"></div>
</section>

<div id="modal"><div class="sheet" id="sheet"></div></div>

<script>
  'use strict';
//<core>
const W=360,H=540,PR=13,BR=4,SLR=82,ZT=30,TAU=Math.PI*2;
const OBS=[[60,190,70,14],[230,336,70,14],[250,120,14,60],[96,360,14,60],[160,250,40,40]];
const CLS={
  pistol:{n:'Gun',tag:'Polyvalent',hp:5,spd:205,fr:.29,bs:520,dmg:1,life:1.7,bounce:1,pel:1,spr:0,dashCd:1.4,desc:'Tir rapide. Les balles ricochent une fois sur les murs.',st:[.6,.45,.7]},
  sniper:{n:'Sniper',tag:'Précision',hp:5,spd:195,fr:.75,bs:920,dmg:2,life:1.5,bounce:2,pel:1,spr:0,dashCd:1.4,desc:'Un tir lent qui fait 2 dégâts et ricoche 2 fois. Chaque raté se paie.',st:[.45,.95,1]},
  shotgun:{n:'Fusil',tag:'Corps à corps',hp:5,spd:195,fr:1.05,bs:480,dmg:1,life:.38,bounce:0,pel:5,spr:.55,dashCd:1.2,desc:'5 plombs qui font très mal de près. Ne portent pas loin.',st:[.5,.9,.25]},
  blade:{n:'Épée',tag:'Assassin',hp:5,spd:228,fr:.75,melee:true,dmg:2,dashCd:1.1,bounce:0,pel:1,spr:0,desc:'Fonce et tranche (2 dégâts). Coupe les balles. Une parade te sonne.',st:[.9,.8,.15]},
  turret:{n:'Tourelle',hp:999,spd:0,fr:1.7,bs:230,dmg:1,life:3,bounce:1,pel:1,spr:0,dashCd:9}
};
const PICKS=['pistol','blade','sniper','shotgun'];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angD=(a,b)=>{let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
const num=(v,a,b,d)=>{v=+v;return Number.isFinite(v)?clamp(v,a,b):d};
function mkP(cls,x,y,a){const C=CLS[cls];return{cls,x,y,hp:C.hp,maxhp:C.hp,aim:a,fireCd:.4,dashCd:0,dashT:0,dvx:0,dvy:0,inv:0,parryT:0,parryCd:0,stun:0,hurt:0,lunge:0,lvx:0,lvy:0,zone:.6,n:0,ai:{think:0,st:0,sd:1,lx:x,ly:y,vx:0,vy:0,noise:0,snap:null,seen:{},pr:{},clean:0,fok:true}}}
function mkW(c0,c1,live){return{t:0,p:[mkP(c0,W/2,H-70,-Math.PI/2),mkP(c1,W/2,70,Math.PI/2)],b:[],out:[],fx:[],auth:[true,!live]}}
const inset=w=>w.t>ZT?Math.min(200,(w.t-ZT)*7):0;
function los(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/8);for(let k=1;k<n;k++){const x=x1+(x2-x1)*k/n,y=y1+(y2-y1)*k/n;for(const o of OBS)if(x>o[0]-3&&x<o[0]+o[2]+3&&y>o[1]-3&&y<o[1]+o[3]+3)return false}return true}
function movePl(p,dx,dy){p.x=clamp(p.x+dx,PR,W-PR);p.y=clamp(p.y+dy,PR,H-PR);for(const o of OBS){const cx=clamp(p.x,o[0],o[0]+o[2]),cy=clamp(p.y,o[1],o[1]+o[3]),ex=p.x-cx,ey=p.y-cy,d=Math.hypot(ex,ey);if(d<PR){if(d>.001){p.x+=ex/d*(PR-d);p.y+=ey/d*(PR-d)}else p.y-=PR}}p.x=clamp(p.x,PR,W-PR);p.y=clamp(p.y,PR,H-PR)}
const rmB=(w,b)=>{const i=w.b.indexOf(b);if(i>=0)w.b.splice(i,1)};
const oid=b=>b.id[0]==='r'?b.id.slice(1):b.id;

function botInputs(w,i,skill,dt){const p=w.p[i],q=w.p[1-i],C=CLS[p.cls],ai=p.ai;const inp={mx:0,my:0,aim:p.aim,fire:false,dash:false,parry:false};if(p.hp<=0||skill===-1)return inp;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;if(skill===-2){inp.aim=Math.atan2(dy,dx);inp.fire=true;return inp}const R=skillP(skill);const kf=Math.min(1,dt*10);ai.vx+=((q.x-ai.lx)/dt-ai.vx)*kf;ai.vy+=((q.y-ai.ly)/dt-ai.vy)*kf;ai.lx=q.x;ai.ly=q.y;ai.think-=dt;if(ai.think<=0||!ai.snap){ai.think=R.rt*(.6+Math.random()*.8);ai.snap={x:q.x,y:q.y,vx:ai.vx,vy:ai.vy};ai.noise=(Math.random()-.5)*2*R.err;ai.fok=Math.random()<R.acc}const s=ai.snap,bs=C.bs||600;let tx=s.x,ty=s.y;if(R.lead>0&&!C.melee){let t=Math.hypot(tx-p.x,ty-p.y)/bs;for(let k=0;k<2;k++){tx=s.x+s.vx*t*R.lead;ty=s.y+s.vy*t*R.lead;t=Math.hypot(tx-p.x,ty-p.y)/bs}}tx=clamp(tx,PR,W-PR);ty=clamp(ty,PR,H-PR);inp.aim=Math.atan2(ty-p.y,tx-p.x)+ai.noise;const clear=los(p.x,p.y,q.x,q.y);if(C.melee)inp.fire=d<84&&ai.fok&&clear;else{const reach=C.life*C.bs+30;inp.fire=clear&&ai.fok&&d<reach;if(skill>.7&&q.parryT>0)inp.fire=false}let mx=0,my=0;const rad=clamp((d-PREF[p.cls])/70,-1,1);mx+=ux*rad;my+=uy*rad;ai.st-=dt;if(ai.st<=0){ai.st=.45+Math.random()*(skill>.7?.8:1.3);ai.sd=Math.random()<.5?-1:1}const sw=C.melee?.6:1;mx+=-uy*ai.sd*sw;my+=ux*ai.sd*sw;if(skill>.3){const da=angD(q.aim,Math.atan2(-dy,-dx));if(Math.abs(da)<.25&&d>50){const nx=-Math.sin(q.aim),ny=Math.cos(q.aim),sg=((p.x-q.x)*nx+(p.y-q.y)*ny)>=0?1:-1;mx+=nx*sg*1.6;my+=ny*sg*1.6}}const mg=48;if(p.x<mg)mx+=1;if(p.x>W-mg)mx-=1;if(p.y<mg)my+=1;if(p.y>H-mg)my-=1;const ins=inset(w);if(ins>0&&!(p.x>ins+30&&p.x<W-ins-30&&p.y>ins+30&&p.y<H-ins-30)){const cx=W/2-p.x,cy=H/2-p.y,m=Math.hypot(cx,cy)||1;mx+=cx/m*2.5;my+=cy/m*2.5}if(C.melee&&skill>.3&&p.dashCd<=0&&d>110&&d<260&&clear&&Math.random()<dt*4){inp.dash=true;mx=ux;my=uy}let th=null;for(const b of w.b){if(b.o===i)continue;const rx=b.x-p.x,ry=b.y-p.y,v2=b.vx*b.vx+b.vy*b.vy;if(v2<1)continue;const t=-(rx*b.vx+ry*b.vy)/v2;i
